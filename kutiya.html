<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <title>Redirecting to Neem Karoli Maharaj Kutir — Dr. Mungali Seva Foundation</title>

  <!-- Tell crawlers this page has moved.
       GitHub Pages can't return a real 301, so we use the closest equivalent:
       a 0-second meta-refresh + a canonical pointing to the new URL +
       noindex so this stub is removed from the index. -->
  <meta http-equiv="refresh" content="0; url=/neem-karoli-maharaj-kutir.html" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://drmungali.org/neem-karoli-maharaj-kutir.html" />

  <!-- Favicons -->
  <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">

  <link rel="stylesheet" href="./styles.css" />

  <style>
    .redirect-wrap{
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    .redirect-wrap .inner{ max-width: 560px; }
    .redirect-wrap h1{
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(28px, 4vw, 40px);
      margin: 0 0 14px;
    }
    .redirect-wrap p{ color: #2A1A14; line-height: 1.6; }
    .redirect-wrap a.btn{ margin-top: 18px; }
  </style>

  <script>
    // Belt-and-braces client redirect in case meta-refresh is blocked.
    window.location.replace("/neem-karoli-maharaj-kutir.html");
  </script>
</head>

<body>
  <div class="redirect-wrap">
    <div class="inner">
      <h1>This page has moved</h1>

        If your browser does not redirect in a moment, please follow the link below.
      </p>
      <p>
        <a class="btn primary" href="/neem-karoli-maharaj-kutir.html">
          Go to Neem Karoli Maharaj Kutir →
        </a>
      </p>
    </div>
  </div>
</body>
</html>
